services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      BACKEND_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
      VITE_UI_PREVIEW: ${VITE_UI_PREVIEW:-true}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DATABASE:?Set MONGO_DATABASE in .env}?authSource=admin&replicaSet=rs0
      MONGODB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-5000}
      MONGOOSE_AUTO_INDEX: ${MONGOOSE_AUTO_INDEX:-true}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_TIMEOUT_MS: ${CLOUDINARY_TIMEOUT_MS:-30000}
      MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-10}
      GENERATION_ENABLED: ${GENERATION_ENABLED:-false}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDINARY_ACCOUNT_ALIAS: ${CLOUDINARY_ACCOUNT_ALIAS:-demo-primary}
      IMAGE_STORAGE_NAMESPACE: ${IMAGE_STORAGE_NAMESPACE:-flux-studio/docker}
      DAILY_USER_LIMIT: ${DAILY_USER_LIMIT:-5}
      DAILY_APP_LIMIT: ${DAILY_APP_LIMIT:-20}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - backend_checkpoints:/app/data
      - /app/node_modules
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    command: ["npm", "run", "dev"]

  mongodb:
    image: mongo:8.0.32-noble
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    command: ["mongod", "--bind_ip_all", "--replSet", "rs0", "--keyFile", "/run/mongo-key/keyfile"]
    depends_on:
      mongodb-key:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_key:/run/mongo-key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongodb-key:
    image: mongo:8.0.32-noble
    user: "0:0"
    entrypoint: ["bash", "-ec"]
    command:
      - |
        if [ ! -s /keys/keyfile ]; then
          umask 077
          head -c 756 /dev/urandom | base64 -w 0 > /keys/keyfile
        fi
        chown mongodb:mongodb /keys/keyfile
        chmod 400 /keys/keyfile
    volumes:
      - mongodb_key:/keys

  mongodb-init:
    image: mongo:8.0.32-noble
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    entrypoint: ["mongosh", "--nodb", "--quiet", "/scripts/init-replica.js"]
    volumes:
      - ./backend/scripts/docker:/scripts:ro
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_key:
  backend_checkpoints:
